name: Integrated browser, API and PostgreSQL verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "visual.md"
      - "docs/testing/**"
  workflow_dispatch:

concurrency:
  group: mintline-integrated-e2e-${ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrated-e2e:
    name: Production frontend + FastAPI + PostgreSQL + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mintline_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mintline_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mintline_e2e
      PSQL_URL: postgresql://postgres:postgres@127.0.0.1:5432/mintline_e2e
      VITE_API_BASE_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    steps:
      - name: Check out frontend main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out the backend main source
        run: git clone --depth 1 --branch main https://github.com/faizansaiyed123/backend-intern-credits.git backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generate a run-only admin key
        shell: bash
        run: echo "ADMIN_API_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Install frontend packages and Playwright Chromium
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build the production frontend
        run: npm run build

      - name: Install actual backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/backend-intern-credits/src/requirements.txt

      - name: Initialize isolated PostgreSQL schema and known test records
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f backend/backend-intern-credits/schema.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO users (user_id, email, name) VALUES (1, 'e2e-mintline@example.invalid', 'Mintline E2E Test User');"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "SELECT setval(pg_get_serial_sequence('users', 'user_id'), 1, true);"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO credits (user_id, credits) VALUES (1, 120);"

      - name: Start the FastAPI backend from backend main
        shell: bash
        run: |
          cd backend/backend-intern-credits
          nohup python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > /tmp/mintline-backend.log 2>&1 < /dev/null &
          echo $! > /tmp/mintline-backend.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null && curl -fsS http://127.0.0.1:8000/api/credits/1 >/dev/null; then
              echo "Backend health and database-backed account endpoint are ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mintline-backend.log
          exit 1

      - name: Start the built frontend preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mintline-frontend.log 2>&1 < /dev/null &
          echo $! > /tmp/mintline-frontend.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Production frontend preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mintline-frontend.log
          exit 1

      - name: Run browser-to-API integration and direct SQL assertions
        run: node scripts/e2e-credit-workspace.mjs

      - name: Upload screenshots and network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintline-integrated-e2e-evidence
          path: |
            visual.md
            docs/testing/INTEGRATION-REPORT.md
            docs/testing/api-network.json
            docs/testing/visuals/
            /tmp/mintline-backend.log
            /tmp/mintline-frontend.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish passing screenshots and walkthrough to main
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual.md docs/testing/INTEGRATION-REPORT.md docs/testing/api-network.json docs/testing/visuals/
          if git diff --cached --quiet; then
            echo "Evidence files are unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish verified Mintline E2E walkthrough"
          git push origin HEAD:main
