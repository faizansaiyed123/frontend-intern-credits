name: Integrated browser, API and PostgreSQL verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "visual.md"
      - "docs/testing/**"
      - "docs/walkthrough/**"
  workflow_dispatch:

concurrency:
  group: mintline-integrated-e2e-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrated-e2e:
    name: Production frontend + FastAPI + PostgreSQL + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mintline_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mintline_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mintline_e2e
      PSQL_URL: postgresql://postgres:postgres@127.0.0.1:5432/mintline_e2e
      VITE_API_BASE_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    steps:
      - name: Check out frontend main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out the backend main source
        run: git clone --depth 1 --branch main https://github.com/faizansaiyed123/backend-intern-credits.git backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generate run-only operator and schema keys
        shell: bash
        run: |
          admin_key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          credit_key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$admin_key"
          echo "::add-mask::$credit_key"
          echo "ADMIN_API_KEY=$admin_key" >> "$GITHUB_ENV"
          echo "CREDIT_ADMIN_API_KEY=$credit_key" >> "$GITHUB_ENV"

      - name: Install frontend packages and verify hosted Chrome
        run: |
          npm install
          npm install --no-save playwright
          google-chrome --version

      - name: Build the production frontend
        run: npm run build

      - name: Install actual backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/backend-intern-credits/src/requirements.txt

      - name: Initialize isolated PostgreSQL schema
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f backend/backend-intern-credits/schema.sql
          # The browser E2E creates its own account through the real registration API.
          # Keep the database otherwise empty so the generated user ID is deterministic.

      - name: Start the FastAPI backend from backend main
        shell: bash
        run: |
          cd backend/backend-intern-credits
          nohup python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > /tmp/mintline-backend.log 2>&1 < /dev/null &
          echo $! > /tmp/mintline-backend.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null && curl -fsS http://127.0.0.1:8000/api/credits/1 >/dev/null; then
              echo "Backend health and database-backed account endpoint are ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mintline-backend.log
          exit 1

      - name: Start the built frontend preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mintline-frontend.log 2>&1 < /dev/null &
          echo $! > /tmp/mintline-frontend.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Production frontend preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mintline-frontend.log
          exit 1

      - name: Run browser-to-API integration and direct SQL assertions
        run: node scripts/e2e-credit-workspace.mjs

      - name: Collect server logs for diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p docs/testing/runtime-logs
          [ ! -f /tmp/mintline-backend.log ] || cp /tmp/mintline-backend.log docs/testing/runtime-logs/backend.log
          [ ! -f /tmp/mintline-frontend.log ] || cp /tmp/mintline-frontend.log docs/testing/runtime-logs/frontend.log

      - name: Upload screenshots and network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintline-integrated-e2e-evidence
          path: |
            visual.md
            docs/testing/INTEGRATION-REPORT.md
            docs/testing/api-network.json
            docs/testing/visuals/
            docs/testing/runtime-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish integrated test evidence without changing product screenshots
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(mktemp -d)"
          mkdir -p "$evidence/docs/testing"
          cp docs/testing/INTEGRATION-REPORT.md "$evidence/docs/testing/"
          cp docs/testing/api-network.json "$evidence/docs/testing/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          cp "$evidence/docs/testing/INTEGRATION-REPORT.md" docs/testing/
          cp "$evidence/docs/testing/api-network.json" docs/testing/

          git add docs/testing/INTEGRATION-REPORT.md docs/testing/api-network.json
          if git diff --cached --quiet; then
            echo "Published integration evidence already matches main; nothing to commit."
            exit 0
          fi
          git commit -m "Publish Mintline integration evidence"
          git push origin HEAD:main
